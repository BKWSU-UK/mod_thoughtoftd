name: Release

# Publishes a GitHub release with the installable module ZIP attached.
#
# Trigger by pushing a version tag that matches the manifest version, e.g.:
#   git tag v5.0.0 && git push origin v5.0.0
#
# Or run manually from the Actions tab (workflow_dispatch); the release tag is
# then derived from the <version> in mod_thoughtoftd.xml.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Lint PHP
        run: |
          for f in mod_thoughtoftd.php Helper/ThoughtoftdHelper.php tmpl/*.php; do
            php -l "$f"
          done

      - name: Read module version
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<version>)[^<]+' mod_thoughtoftd.xml)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read <version> from mod_thoughtoftd.xml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Module version: $VERSION"

      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${TAG_VERSION}) does not match manifest version ${{ steps.version.outputs.version }}. Update <version> in mod_thoughtoftd.xml or retag."
            exit 1
          fi

      - name: Build package
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ steps.version.outputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          ASSET="mod_thoughtoftd_v${{ steps.version.outputs.version }}.zip"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading/replacing asset."
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "mod_thoughtoftd $TAG" \
              --generate-notes
          fi

      - name: Sync update.xml on the default branch
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ASSET="mod_thoughtoftd_v${VERSION}.zip"

          # Checksums of the exact ZIP published as the release asset. The build
          # output is gitignored, so it survives the checkout below.
          SHA256=$(sha256sum "$ASSET" | cut -d' ' -f1)
          SHA512=$(sha512sum "$ASSET" | cut -d' ' -f1)

          git fetch origin main
          git checkout main

          # Point the single update entry at the new version, release asset and checksums.
          sed -i -E "s|<version>[^<]+</version>|<version>${VERSION}</version>|" update.xml
          sed -i -E "s|releases/download/v[^/]+/mod_thoughtoftd_v[^<]+\.zip|releases/download/v${VERSION}/mod_thoughtoftd_v${VERSION}.zip|" update.xml
          sed -i -E "s|<sha256>[^<]*</sha256>|<sha256>${SHA256}</sha256>|" update.xml
          sed -i -E "s|<sha512>[^<]*</sha512>|<sha512>${SHA512}</sha512>|" update.xml

          if git diff --quiet update.xml; then
            echo "update.xml already current for ${VERSION}."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add update.xml
            git commit -m "chore: point update.xml at ${VERSION}"
            git push origin main
          fi
